# Gradle 성능 최적화 설정

# Gradle 데몬 활성화
org.gradle.daemon=true

# 병렬 빌드 활성화
org.gradle.parallel=true

# JVM 최적화
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError

# Gradle 빌드 캐시 활성화
org.gradle.caching=true

# Configuration 캐시 활성화 (Gradle 6.6+)
org.gradle.configuration-cache=false

# 파일 시스템 감시 활성화 (Gradle 6.5+)
org.gradle.vfs.watch=true

# 의존성 다운로드 최적화
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000

# Spring Boot DevTools 비활성화 (CI에서)
spring.devtools.restart.enabled=false

