name: 🧪 CI Pipeline - Test & Quality Gate

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - dev
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
          xpack.security.enabled: "false"
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Create application.yml file
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml

      - name: Disable IPv6
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2
        with:
          min-wrapper-count: 1
          allow-snapshots: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify Gradle Wrapper Checksum
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Gradle wrapper configuration verified"
            cat gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-build-scan-report: true
          cache-read-only: false

      - name: Wait for Elasticsearch to be ready
        run: |
          echo "Waiting for Elasticsearch..."
          for i in {1..20}; do
            if curl -fsS http://localhost:9200 >/dev/null; then
              echo "Elasticsearch is up!"
              exit 0
            fi
              echo "Retrying in 3s..."
              sleep 3
            done
            echo "Elasticsearch did not become ready in time."
            exit 1

      - name: Run tests
        run: |
          ./gradlew clean test \
            --parallel \
            --build-cache \
            --configuration-cache \
            --daemon \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:+UseParallelGC" \
            -Dspring.profiles.active=test
        env:
          SPRING_ELASTICSEARCH_URIS: http://localhost:9200

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  build-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Create application.yml file
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Compile check
        run: |
          ./gradlew compileJava compileTestJava \
            --parallel \
            --build-cache \
            --configuration-cache