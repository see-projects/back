name: Java CI with Gradle

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
      - develop

# 동시 실행 제어 - 같은 PR에서 새 커밋이 올라오면 이전 워크플로우 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # 전체 히스토리가 필요하지 않으면 shallow clone 사용
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Gradle 의존성을 JDK와 함께 캐시
          cache: gradle

      - name: Create application.yml file
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml

      # Gradle Wrapper 검증 (보안)
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      # Gradle 빌드 액션 사용 (캐싱과 최적화가 내장됨)
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          # 빌드 스캔 활성화 (선택적)
          gradle-build-scan-report: true
          # 캐시 설정
          cache-read-only: false

      # 테스트 실행 - 병렬 처리 및 최적화 옵션 추가
      - name: Run tests
        run: |
          ./gradlew clean test \
            --parallel \
            --build-cache \
            --configuration-cache \
            --daemon \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:+UseParallelGC" \
            -Dspring.profiles.active=test

      # 테스트 결과 리포트 업로드 (실패 시에도 실행)
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  # 빌드 검증을 별도 job으로 분리 (빠른 피드백용)
  build-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Create application.yml file
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      # 컴파일만 확인 (테스트 제외)
      - name: Compile check
        run: |
          ./gradlew compileJava compileTestJava \
            --parallel \
            --build-cache \
            --configuration-cache
