name: 🧪 CI Pipeline - Test & Quality Gate

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - dev
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Create application.yml file
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml

      # IPv6 비활성화 (네트워크 오류 방지)
      - name: Disable IPv6
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      # Gradle Wrapper 검증 (보안)
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2
        with:
          min-wrapper-count: 1
          allow-snapshots: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify Gradle Wrapper Checksum
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Gradle wrapper configuration verified"
            cat gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-build-scan-report: true
          cache-read-only: false

      - name: Run tests
        run: |
          ./gradlew clean test \
            --parallel \
            --build-cache \
            --configuration-cache \
            --daemon \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:+UseParallelGC" \
            -Dspring.profiles.active=test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  build-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Create application.yml file
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Compile check
        run: |
          ./gradlew compileJava compileTestJava \
            --parallel \
            --build-cache \
            --configuration-cache
