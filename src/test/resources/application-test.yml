spring:
  datasource:
    url: jdbc:mysql://localhost:3306/see_test?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: see_user
    password: see_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect  # ✅ 이 한 줄 추가!
    show-sql: true  # SQL 출력 원하면 추가

logging:
  level:
    dooya.see: INFO
    org.hibernate.SQL: DEBUG